<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
     <link rel="icon" href="./imagens/joystick-alt-2.svg" type="image/svg+xml" >
 
    <link rel="stylesheet" href="css/feedback.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
 
<div class="container">
 
    <div class="left">
 
        <a href="index.html" class="home-icon">
            <i class='bx bx-home-alt'></i>
        </a>
 
        <h1>
            COMO FOI SUA <span>EXPERIÊNCIA ?</span>
        </h1>
       
        <form class="form" action="agradecimento.html" method="GET">
 
            <input type="text" id="nome" placeholder="Digite o seu nome..." required>
 
            <input type="email" id="email" placeholder="Digite o seu e-mail..." required>
 
            <textarea id="feedback" placeholder="Deixe aqui o seu feedback" required></textarea>
 
            <button type="submit" class="botao-enviar">
                Enviar
            </button>
 
        </form>
 
</div>
 
</body>
</html>
